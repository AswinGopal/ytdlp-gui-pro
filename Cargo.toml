[package]
name = "ytdownloader"
version = "1.0.0"
edition = "2024"

[lib]
name = "ytdownloader"
path = "src/lib.rs"

[dependencies]
dirs = "6.0"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
process-wrap = { version = "10", features = ["std"] }

# `CREATE_NO_WINDOW` for `process-wrap`'s `CreationFlags` wrapper. The version
# must match the `windows` that `process-wrap` itself depends on (0.62.x for
# process-wrap 10), or the flag's type will not be the one it expects.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }
