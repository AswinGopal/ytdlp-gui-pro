# .github/workflows/release.yml
#
# The application version lives in exactly one place: the `version` field of
# src-tauri/Cargo.toml. Tauri bakes it into the binary at build time and the
# UI reads it back from there, so the version a release is published under and
# the version the program shows cannot drift apart.
#
# Releasing:
#   1. Bump `version` in src-tauri/Cargo.toml and commit it together with the
#      src-tauri/Cargo.lock change Cargo makes on the next build.
#   2. Then either
#        • git tag v1.2.3 && git push origin v1.2.3
#          git tag v1.2.3-beta.1 && git push origin v1.2.3-beta.1
#        • GitHub UI → Actions → Release → Run workflow
#          (tags the selected commit as v<Cargo.toml version>)
#
# The workflow fails before building anything when the version is not valid
# semver (x.y.z or x.y.z-prerelease; no build metadata) or when a pushed tag
# is not exactly `v` + the Cargo.toml version.
#
# Pre-release detection: any version containing a hyphen (e.g. 1.2.3-beta.1)
# is published as a pre-release; bare x.y.z versions are published as stable.
#
# Artifact storage is not used. Each build runner publishes its binary
# directly to the GitHub release via softprops/action-gh-release.
# A create-tag job runs first on workflow_dispatch to create the git tag
# before the matrix starts, avoiding a race between runners.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.11.3"

jobs:
  # ── Resolve version ──────────────────────────────────────────────────────────
  # Reads the version from src-tauri/Cargo.toml, validates it, and, on a tag
  # push, checks the pushed tag against it. Every later job takes its version,
  # tag and pre-release flag from this job's outputs.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4

      - name: Read and validate version
        id: resolve
        shell: bash
        run: |
          # semver.org's reference pattern, without the build-metadata part.
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?$'

          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])')"

          if ! [[ "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Version '$VERSION' in src-tauri/Cargo.toml is not valid semver (x.y.z or x.y.z-prerelease)"
            exit 1
          fi

          TAG="v${VERSION}"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match src-tauri/Cargo.toml (expected '$TAG')"
            exit 1
          fi

          [[ "$VERSION" == *-* ]] && PRE=true || PRE=false

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${TAG} (prerelease=${PRE})"

  # ── Create tag (workflow_dispatch only) ──────────────────────────────────────
  # Creates the git tag at the dispatched commit before the build matrix starts
  # so both runners have a tag to publish against without racing to create it
  # themselves. Skipped entirely on tag-push runs (the tag already exists).
  create-tag:
    name: Create tag
    needs: [version]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Fail fast if the tag already exists rather than silently overwriting.
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
               --silent 2>/dev/null; then
            echo "::error::Tag '$TAG' already exists"
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            --method POST \
            --field ref="refs/tags/${TAG}" \
            --field sha="${GITHUB_SHA}"

          echo "Created tag ${TAG} at ${GITHUB_SHA}"

  # ── Build + publish ───────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.platform }}
    needs: [version, create-tag]
    # Passes when the version resolved and create-tag succeeded (workflow_dispatch)
    # or was skipped (tag push).
    if: >-
      always()
      && needs.version.result == 'success'
      && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            binary: ytdownloader-gui
            artifact: ytdownloader-linux
            tauri_asset: cargo-tauri-x86_64-unknown-linux-gnu.tgz   # confirmed

          - os: windows-latest
            platform: windows
            binary: ytdownloader-gui.exe
            artifact: ytdownloader-windows.exe
            tauri_asset: cargo-tauri-x86_64-pc-windows-msvc.zip     # inferred — verify

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Tauri v2 on Linux requires these GTK / WebKit headers at compile time.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Caches ~/.cargo/registry and src-tauri/target across runs.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.platform }}

      - name: Install Tauri CLI
        shell: bash
        run: |
          BASE="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}"
          ASSET="${{ matrix.tauri_asset }}"
          curl -fL "${BASE}/${ASSET}" -o tauri-cli-asset
          case "${ASSET}" in
            *.tgz|*.tar.gz) tar -xz -f tauri-cli-asset -C ~/.cargo/bin ;;
            *.zip)          unzip -o tauri-cli-asset -d ~/.cargo/bin    ;;
          esac
          rm tauri-cli-asset

      # --no-bundle skips .deb / .AppImage / .msi / .dmg — binary only.
      # The binary's version is src-tauri/Cargo.toml's, the same one the
      # `version` job validated above.
      # Output: src-tauri/target/release/{binary}
      - name: Build binary
        run: cargo tauri build --no-bundle

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "src-tauri/target/release/${{ matrix.binary }}" \
             "dist/${{ matrix.artifact }}"

      # The first runner to reach this step creates the release; the second
      # appends its binary. generate_release_notes is a no-op on the second
      # call since the release already exists.
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/${{ matrix.artifact }}
